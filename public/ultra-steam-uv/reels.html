<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zobacz COBBO w praktyce</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: #fff;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #000;
    }

    button,
    a {
      font: inherit;
    }

    .cobbo-reels {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 34px 52px 38px;
      background: #fff;
      color: #000;
    }

    /* HEADER */

    .cobbo-reels__header {
      width: 100%;
      max-width: 760px;
      margin: 0 auto 28px;
      text-align: center;
      color: #000;
    }

    .cobbo-reels__title {
      margin: 0 0 10px;
      color: #000 !important;
      font-size: clamp(27px, 2.5vw, 36px);
      line-height: 1.12;
      font-weight: 750;
      letter-spacing: -0.025em;
    }

    .cobbo-reels__description {
      margin: 0;
      color: #000 !important;
      font-size: 15px;
      line-height: 1.55;
      opacity: .72;
    }

    /* SLIDER */

    .cobbo-reels__slider {
      position: relative;
      width: 100%;
    }

    .cobbo-reels__track {
      display: flex;
      gap: 16px;
      width: 100%;
      padding: 5px 2px 18px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x;
    }

    .cobbo-reels__track::-webkit-scrollbar {
      display: none;
    }

    .cobbo-reels__track.is-dragging {
      cursor: grabbing;
      scroll-behavior: auto;
      scroll-snap-type: none;
    }

    /* CARD
       Wysokość obejmuje nagłówek Instagrama + pionowy film.
       Dolna część embedu jest celowo przycinana. */

    .cobbo-reel {
      position: relative;
      z-index: 0;
      flex: 0 0 calc((100% - 48px) / 3.45);
      aspect-ratio: 9 / 17.6;
      overflow: hidden;
      scroll-snap-align: start;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09);
      transition: transform 180ms ease, box-shadow 180ms ease;
      isolation: isolate;
    }

    .cobbo-reel:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.14);
    }

    /*
      Instagram dostaje dodatkową wysokość, żeby nie ściskał
      pionowego filmu w celu zmieszczenia dolnego interfejsu.
      Sama karta ma overflow:hidden, więc footer Instagrama
      nie jest widoczny.
    */

    .cobbo-reel__embed-shell {
      position: absolute;
      inset: 0;

      /*
        Osobny, niski stacking context. Instagram potrafi
        nadać swojemu iframe własne z-indexy. Dzięki temu
        żaden element embedu nie może wejść nad naszą
        strefę kliknięcia filmu.
      */
      z-index: 1;
      isolation: isolate;

      overflow: hidden;
      background: #fff;
    }

    /*
      Oficjalny Instagram embed.js tworzy iframe wewnątrz
      naszego kontenera. Wymuszamy pełną szerokość i zostawiamy
      zapas wysokości, a dolny interfejs Instagrama przycina karta.
    */
    .cobbo-reel__embed-shell .instagram-media,
    .cobbo-reel__embed-shell iframe.instagram-media-rendered {
      width: 100% !important;
      min-width: 0 !important;
      max-width: none !important;
      margin: 0 !important;
      border: 0 !important;
    }

    .cobbo-reel__embed-shell iframe.instagram-media-rendered {
      height: calc(100% + 240px) !important;
      background: #fff !important;
    }

    .cobbo-reel__embed-shell .instagram-media {
      background: #fff !important;
    }

    /*
      Niewidoczna warstwa zaczyna się POD nagłówkiem profilu.
      Nagłówek Instagrama pozostaje interaktywny, więc można
      kliknąć profil / "Wyświetl profil".
    */

    .cobbo-reel__video-click {
      position: absolute;

      /*
        Musi być wyżej niż cały renderer Instagrama,
        także gdy Instagram pokazuje fallback
        "Obejrzyj na Instagramie".
      */
      z-index: 100;

      top: 58px;
      left: 0;
      right: 0;
      bottom: 0;

      display: block;

      padding: 0;
      margin: 0;
      border: 0;

      /*
        Minimalnie nieprzezroczyste tło poprawia obsługę
        tapnięć nad cross-origin iframe w mobilnym Safari,
        wizualnie pozostając niewidoczne.
      */
      background: rgba(0, 0, 0, 0.001);

      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .cobbo-reel__video-click:focus-visible {
      outline: 3px solid #000;
      outline-offset: -5px;
    }

    /* SLIDER ARROWS */

    .cobbo-reels__arrow {
      position: absolute;
      top: 50%;
      z-index: 20;
      width: 47px;
      height: 47px;
      transform: translateY(-50%);
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 7px 24px rgba(0, 0, 0, 0.17);
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .cobbo-reels__arrow:hover {
      transform: translateY(-50%) scale(1.06);
    }

    .cobbo-reels__arrow--prev {
      left: -23px;
    }

    .cobbo-reels__arrow--next {
      right: -23px;
    }

    .cobbo-reels__arrow:disabled {
      opacity: .25;
      pointer-events: none;
    }

    /* ==============================================
       FULLSCREEN POPUP
       Popup znajduje się w tym samym pliku.
       Po kliknięciu moduł korzysta z Fullscreen API.
       ============================================== */

    .cobbo-reel-popup {
      position: fixed;
      inset: 0;
      z-index: 999999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .92);
    }

    .cobbo-reel-popup.is-open {
      display: flex;
    }

    .cobbo-reel-popup:fullscreen {
      display: flex;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, .94);
    }

    .cobbo-reel-popup:-webkit-full-screen {
      display: flex;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, .94);
    }

    .cobbo-reel-popup__dialog {
      position: relative;
      width: min(440px, calc(100vw - 28px));
      height: min(92vh, 860px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 30px 100px rgba(0, 0, 0, .48);
    }

    .cobbo-reel-popup__video {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      background: #fff;
    }

    .cobbo-reel-popup__embed-host {
      position: absolute;
      inset: 0;
      overflow: auto;
      overscroll-behavior: contain;
      background: #fff;
      scrollbar-width: none;
    }

    .cobbo-reel-popup__embed-host::-webkit-scrollbar {
      display: none;
    }

    .cobbo-reel-popup__embed-host .instagram-media,
    .cobbo-reel-popup__embed-host iframe.instagram-media-rendered {
      width: 100% !important;
      min-width: 0 !important;
      max-width: none !important;
      margin: 0 !important;
      border: 0 !important;
    }

    .cobbo-reel-popup__embed-host iframe.instagram-media-rendered {
      min-height: 100% !important;
      background: #fff !important;
    }

    .cobbo-reel-popup__footer {
      flex: 0 0 auto;
      padding: 11px;
      background: #fff;
    }

    .cobbo-reel-popup__instagram {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 11px 18px;
      border-radius: 14px;
      background: #000;
      color: #fff !important;
      text-decoration: none !important;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 700;
    }

    .cobbo-reel-popup__close,
    .cobbo-reel-popup__nav {
      position: fixed;
      z-index: 1000000001;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
      box-shadow: 0 7px 25px rgba(0, 0, 0, .28);
      cursor: pointer;
    }

    .cobbo-reel-popup__close {
      top: 18px;
      right: 18px;
      width: 46px;
      height: 46px;
      padding: 0;
      font-size: 30px;
      line-height: 1;
    }

    .cobbo-reel-popup__nav {
      top: 50%;
      width: 50px;
      height: 50px;
      transform: translateY(-50%);
      padding: 0;
      font-size: 34px;
      line-height: 1;
    }

    .cobbo-reel-popup__nav--prev {
      left: max(14px, calc(50% - 300px));
    }

    .cobbo-reel-popup__nav--next {
      right: max(14px, calc(50% - 300px));
    }

    .cobbo-reel-popup__nav:disabled {
      opacity: .25;
      pointer-events: none;
    }

    /* TABLET */

    @media (max-width: 1050px) {
      .cobbo-reels {
        padding-left: 46px;
        padding-right: 46px;
      }

      .cobbo-reel {
        flex-basis: calc((100% - 32px) / 2.45);
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .cobbo-reels {
        padding: 26px 0 30px;
      }

      .cobbo-reels__header {
        margin-bottom: 20px;
        padding: 0 18px;
        text-align: left;
      }

      .cobbo-reels__title {
        font-size: 27px;
      }

      .cobbo-reels__description {
        font-size: 14px;
      }

      .cobbo-reels__track {
        gap: 13px;

        /*
          Karta ma 76vw szerokości.
          Połowa pozostałej przestrzeni po bokach = 12vw,
          dzięki czemu pierwszy film od razu startuje na środku.
        */
        padding:
          4px
          12vw
          16px;

        scroll-padding-inline: 12vw;
      }

      .cobbo-reel {
        flex: 0 0 76vw;
        max-width: 360px;

        border-radius: 19px;

        /*
          Każda kolejna rolka po przesunięciu
          zatrzymuje się centralnie.
        */
        scroll-snap-align: center;
      }

      .cobbo-reel__video-click {
        top: 56px;
      }

      .cobbo-reels__arrow {
        width: 41px;
        height: 41px;
        font-size: 29px;
      }

      .cobbo-reels__arrow--prev {
        left: 5px;
      }

      .cobbo-reels__arrow--next {
        right: 5px;
      }

      .cobbo-reel-popup {
        /*
          Na telefonie popup jest celowo mniejszy od pełnej
          wysokości ekranu. Dzięki temu przycisk zamknięcia
          pozostaje zawsze widoczny i nie trzeba przewijać.
        */
        padding:
          max(58px, env(safe-area-inset-top))
          14px
          max(18px, env(safe-area-inset-bottom));
      }

      .cobbo-reel-popup__dialog {
        width: min(350px, calc(100vw - 40px));

        /*
          dvh poprawnie reaguje na pasek adresu w mobilnych
          przeglądarkach. Fallback pozostaje przez max-height.
        */
        height: min(78dvh, 700px);
        max-height: calc(100vh - 105px);

        border-radius: 18px;
      }

      .cobbo-reel-popup__footer {
        padding: 9px;
      }

      .cobbo-reel-popup__instagram {
        min-height: 44px;
        padding: 9px 14px;
        font-size: 13px;
      }

      .cobbo-reel-popup__close {
        top: max(10px, env(safe-area-inset-top));
        right: 10px;

        width: 42px;
        height: 42px;

        font-size: 28px;
      }

      .cobbo-reel-popup__nav {
        width: 40px;
        height: 40px;
        font-size: 28px;
      }

      .cobbo-reel-popup__nav--prev {
        left: 4px;
      }

      .cobbo-reel-popup__nav--next {
        right: 4px;
      }
    }
  </style>
</head>

<body>

<section class="cobbo-reels" id="cobboReels">

  <div class="cobbo-reels__header">
    <h2 class="cobbo-reels__title">
      Zobacz COBBO w praktyce
    </h2>

    <p class="cobbo-reels__description">
      Zobacz, jak nasze urządzenia sprawdzają się w codziennym użytkowaniu.
      Obejrzyj materiały przygotowane przez twórców i poznaj COBBO z praktycznej strony.
    </p>
  </div>

  <div class="cobbo-reels__slider">

    <button
      class="cobbo-reels__arrow cobbo-reels__arrow--prev"
      type="button"
      aria-label="Poprzednie filmy"
    >
      ‹
    </button>

    <div
      class="cobbo-reels__track"
      id="cobboReelsTrack"
    ></div>

    <button
      class="cobbo-reels__arrow cobbo-reels__arrow--next"
      type="button"
      aria-label="Następne filmy"
    >
      ›
    </button>

  </div>

</section>


<div
  class="cobbo-reel-popup"
  id="cobboReelPopup"
  aria-hidden="true"
>
  <button
    class="cobbo-reel-popup__close"
    type="button"
    aria-label="Zamknij film"
  >
    ×
  </button>

  <button
    class="cobbo-reel-popup__nav cobbo-reel-popup__nav--prev"
    type="button"
    aria-label="Poprzedni film"
  >
    ‹
  </button>

  <div
    class="cobbo-reel-popup__dialog"
    role="dialog"
    aria-modal="true"
    aria-label="Instagram Reel"
  >
    <div class="cobbo-reel-popup__video">
      <div
        class="cobbo-reel-popup__embed-host"
        id="cobboPopupEmbedHost"
      ></div>
    </div>

    <div class="cobbo-reel-popup__footer">
      <a
        class="cobbo-reel-popup__instagram"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Zobacz rolkę na Instagramie ↗
      </a>
    </div>
  </div>

  <button
    class="cobbo-reel-popup__nav cobbo-reel-popup__nav--next"
    type="button"
    aria-label="Następny film"
  >
    ›
  </button>
</div>


<script>
(() => {

  /* =========================================================
     ULTRA STEAM UV
     Przy zmianie materiałów edytujemy tylko tę listę.
     Każda pozycja z listy jest wyświetlana, także jeśli link się powtarza.
     ========================================================= */

  const REELS = [
    "https://www.instagram.com/reel/DUIP1orgvCl/",
    "https://www.instagram.com/reels/DcxjoioNhFK/",
    "https://www.instagram.com/reels/DcdwVWgCnBc/",
    "https://www.instagram.com/reel/DVOU6VxAnuP/?utm_source=ig_web_copy_link&stkn=MzRlODBiNWFlZA==",
    "https://www.instagram.com/reels/DUIP1orgvCl/"
  ];

  /* ========================================================= */

  const track = document.getElementById("cobboReelsTrack");
  const prevButton = document.querySelector(".cobbo-reels__arrow--prev");
  const nextButton = document.querySelector(".cobbo-reels__arrow--next");

  const popup = document.getElementById("cobboReelPopup");
  const popupHost = document.getElementById("cobboPopupEmbedHost");
  const popupInstagram = popup.querySelector(".cobbo-reel-popup__instagram");
  const popupClose = popup.querySelector(".cobbo-reel-popup__close");
  const popupPrev = popup.querySelector(".cobbo-reel-popup__nav--prev");
  const popupNext = popup.querySelector(".cobbo-reel-popup__nav--next");

  let activeIndex = 0;
  let dragging = false;
  let dragMoved = false;
  let startX = 0;
  let startScroll = 0;

  function normalizeInstagramUrl(url) {
    try {
      const parsed = new URL(url);

      if (
        parsed.hostname !== "www.instagram.com" &&
        parsed.hostname !== "instagram.com"
      ) {
        return null;
      }

      const match = parsed.pathname.match(/\/reels?\/([^/]+)/);

      if (!match) {
        return null;
      }

      return "https://www.instagram.com/reel/" + match[1] + "/";
    } catch {
      return null;
    }
  }

  /*
    Zachowujemy dokładnie kolejność i liczbę pozycji z REELS.
    Nie używamy Set(), ponieważ w module może celowo wystąpić
    ta sama rolka więcej niż jeden raz.
  */
  const reels = REELS
    .map(normalizeInstagramUrl)
    .filter(Boolean);

  /*
     =========================================================
     OFICJALNY INSTAGRAM EMBED
     =========================================================
     Zamiast ręcznie tworzyć /reel/ID/embed/ korzystamy
     z instagram.com/embed.js, czyli z oficjalnego renderera.
  */

  let instagramScriptPromise = null;

  function loadInstagramScript() {
    if (
      window.instgrm &&
      window.instgrm.Embeds
    ) {
      return Promise.resolve();
    }

    if (instagramScriptPromise) {
      return instagramScriptPromise;
    }

    instagramScriptPromise = new Promise((resolve, reject) => {
      const existing = document.querySelector(
        'script[src*="instagram.com/embed.js"]'
      );

      if (existing) {
        const waitForApi = () => {
          if (
            window.instgrm &&
            window.instgrm.Embeds
          ) {
            resolve();
          } else {
            setTimeout(waitForApi, 80);
          }
        };

        waitForApi();
        return;
      }

      const script = document.createElement("script");
      script.src = "https://www.instagram.com/embed.js";
      script.async = true;

      script.onload = () => resolve();
      script.onerror = () => reject(
        new Error("Nie udało się załadować Instagram embed.js")
      );

      document.body.appendChild(script);
    });

    return instagramScriptPromise;
  }

  function createInstagramEmbed(url) {
    const blockquote = document.createElement("blockquote");

    blockquote.className = "instagram-media";
    blockquote.setAttribute(
      "data-instgrm-permalink",
      url
    );
    blockquote.setAttribute(
      "data-instgrm-version",
      "14"
    );

    blockquote.style.background = "#fff";
    blockquote.style.border = "0";
    blockquote.style.margin = "0";
    blockquote.style.maxWidth = "none";
    blockquote.style.minWidth = "0";
    blockquote.style.padding = "0";
    blockquote.style.width = "100%";

    return blockquote;
  }

  async function processInstagramEmbeds() {
    try {
      await loadInstagramScript();

      if (
        window.instgrm &&
        window.instgrm.Embeds
      ) {
        window.instgrm.Embeds.process();
      }
    } catch (error) {
      console.error(
        "COBBO Reels: Instagram embed.js",
        error
      );
    }
  }

  /*
    Najlepsza możliwa próba autoplay.
    Instagram ostatecznie decyduje, czy dany embed pozwoli
    uruchomić materiał automatycznie.
  */
  function tryEnablePopupAutoplay() {
    let attempts = 0;

    const timer = setInterval(() => {
      attempts++;

      const iframe = popupHost.querySelector(
        "iframe.instagram-media-rendered, iframe"
      );

      if (iframe) {
        iframe.setAttribute(
          "allow",
          "autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
        );

        try {
          const current = new URL(iframe.src);
          current.searchParams.set("autoplay", "1");

          if (iframe.src !== current.href) {
            iframe.src = current.href;
          }
        } catch {}

        clearInterval(timer);
      }

      if (attempts >= 25) {
        clearInterval(timer);
      }
    }, 120);
  }

  /* =========================================================
     RENDER PREVIEWS
     ========================================================= */

  function renderCards() {
    track.innerHTML = "";

    reels.forEach((reelUrl, index) => {

      const card = document.createElement("article");
      card.className = "cobbo-reel";

      const embedShell = document.createElement("div");
      embedShell.className = "cobbo-reel__embed-shell";

      const embed = createInstagramEmbed(reelUrl);
      embedShell.appendChild(embed);

      /*
        Cały obszar VIDEO jest klikalny.
        Górny nagłówek profilu pozostaje dostępny bez naszej warstwy.
      */
      const clickZone = document.createElement("button");
      clickZone.type = "button";
      clickZone.className = "cobbo-reel__video-click";
      clickZone.setAttribute(
        "aria-label",
        "Otwórz film na pełnym ekranie"
      );

      clickZone.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();

        if (dragMoved) {
          return;
        }

        openPopup(index);
      });

      card.appendChild(embedShell);
      card.appendChild(clickZone);
      track.appendChild(card);
    });

    processInstagramEmbeds();

    requestAnimationFrame(() => {
      updateArrows();
      sendHeight();
    });
  }

  /* =========================================================
     POPUP
     ========================================================= */

  async function loadPopupReel() {
    const reel = reels[activeIndex];

    if (!reel) {
      return;
    }

    popupHost.innerHTML = "";
    popupHost.appendChild(
      createInstagramEmbed(reel)
    );

    popupInstagram.href = reel;

    popupPrev.disabled = activeIndex <= 0;
    popupNext.disabled = activeIndex >= reels.length - 1;

    await processInstagramEmbeds();
    tryEnablePopupAutoplay();
  }

  async function enterFullscreen() {
    /*
      Najpierw próbujemy pełnego ekranu na samym popupie.
      Obsługujemy również starszy webkit.
    */

    try {
      if (popup.requestFullscreen) {
        await popup.requestFullscreen({
          navigationUI: "hide"
        });
        return;
      }

      if (popup.webkitRequestFullscreen) {
        popup.webkitRequestFullscreen();
      }
    } catch (error) {
      /*
        Jeśli przeglądarka nie pozwoli na Fullscreen API,
        popup nadal pozostanie otwarty wewnątrz modułu.
      */
      console.info(
        "COBBO Reels: fullscreen niedostępny.",
        error
      );
    }
  }

  function openPopup(index) {
    activeIndex = index;

    loadPopupReel();

    popup.classList.add("is-open");
    popup.setAttribute("aria-hidden", "false");

    /*
      requestFullscreen wywoływany bezpośrednio z kliknięcia,
      żeby zachować user activation.
    */
    enterFullscreen();
  }

  async function closePopup() {
    popup.classList.remove("is-open");
    popup.setAttribute("aria-hidden", "true");
    popupHost.innerHTML = "";

    try {
      if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch {}
  }

  function previousPopupReel() {
    if (activeIndex <= 0) {
      return;
    }

    activeIndex--;
    loadPopupReel();
  }

  function nextPopupReel() {
    if (activeIndex >= reels.length - 1) {
      return;
    }

    activeIndex++;
    loadPopupReel();
  }

  popupClose.addEventListener("click", closePopup);
  popupPrev.addEventListener("click", previousPopupReel);
  popupNext.addEventListener("click", nextPopupReel);

  popup.addEventListener("click", event => {
    if (event.target === popup) {
      closePopup();
    }
  });

  document.addEventListener("keydown", event => {
    if (!popup.classList.contains("is-open")) {
      return;
    }

    if (event.key === "Escape") {
      closePopup();
    }

    if (event.key === "ArrowLeft") {
      previousPopupReel();
    }

    if (event.key === "ArrowRight") {
      nextPopupReel();
    }
  });

  /*
    Jeżeli użytkownik wyjdzie z trybu fullscreen systemowym ESC,
    zamykamy również modal.
  */

  document.addEventListener("fullscreenchange", () => {
    if (
      !document.fullscreenElement &&
      popup.classList.contains("is-open")
    ) {
      popup.classList.remove("is-open");
      popup.setAttribute("aria-hidden", "true");
      popupHost.innerHTML = "";
    }
  });

  /* =========================================================
     SLIDER
     ========================================================= */

  function getScrollDistance() {
    const card = track.querySelector(".cobbo-reel");

    if (!card) {
      return 300;
    }

    const styles = window.getComputedStyle(track);
    const gap = parseFloat(styles.gap || 0);

    return card.offsetWidth + gap;
  }

  prevButton.addEventListener("click", () => {
    track.scrollBy({
      left: -getScrollDistance(),
      behavior: "smooth"
    });
  });

  nextButton.addEventListener("click", () => {
    track.scrollBy({
      left: getScrollDistance(),
      behavior: "smooth"
    });
  });

  function updateArrows() {
    const maxScroll =
      track.scrollWidth -
      track.clientWidth;

    prevButton.disabled =
      track.scrollLeft <= 5;

    nextButton.disabled =
      track.scrollLeft >= maxScroll - 5;
  }

  track.addEventListener(
    "scroll",
    updateArrows,
    { passive: true }
  );

  /* =========================================================
     DRAG DESKTOP
     ========================================================= */

  track.addEventListener("pointerdown", event => {
    if (event.pointerType === "touch") {
      return;
    }

    dragging = true;
    dragMoved = false;
    startX = event.clientX;
    startScroll = track.scrollLeft;

    track.classList.add("is-dragging");
  });

  track.addEventListener("pointermove", event => {
    if (!dragging) {
      return;
    }

    const movement =
      event.clientX -
      startX;

    if (Math.abs(movement) > 6) {
      dragMoved = true;
    }

    track.scrollLeft =
      startScroll -
      movement;
  });

  function finishDrag() {
    if (!dragging) {
      return;
    }

    dragging = false;
    track.classList.remove("is-dragging");

    setTimeout(() => {
      dragMoved = false;
    }, 80);
  }

  track.addEventListener("pointerup", finishDrag);
  track.addEventListener("pointercancel", finishDrag);
  track.addEventListener("pointerleave", finishDrag);

  /* =========================================================
     IFRAME AUTO HEIGHT MESSAGE
     ========================================================= */

  function sendHeight() {
    const height =
      Math.ceil(
        document.documentElement.scrollHeight
      );

    window.parent.postMessage(
      {
        type: "COBBO_REELS_HEIGHT",
        height: height
      },
      "*"
    );
  }

  if ("ResizeObserver" in window) {
    const observer =
      new ResizeObserver(sendHeight);

    observer.observe(
      document.querySelector(
        ".cobbo-reels"
      )
    );
  }

  window.addEventListener("load", sendHeight);

  window.addEventListener("resize", () => {
    updateArrows();
    sendHeight();
  });

  renderCards();

})();
</script>

</body>
</html>
