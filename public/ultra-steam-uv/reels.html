<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zobacz COBBO w praktyce</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: transparent;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #000;
    }

    button { font: inherit; }

    .cobbo-reels {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 34px 54px 38px;
    }

    .cobbo-reels__header {
      width: 100%;
      max-width: 780px;
      margin: 0 auto 28px;
      text-align: center;
    }

    .cobbo-reels__title {
      margin: 0 0 10px;
      font-size: clamp(27px, 2.5vw, 36px);
      line-height: 1.12;
      font-weight: 750;
      letter-spacing: -0.025em;
      color: #000;
    }

    .cobbo-reels__description {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
      color: #000;
    }

    .cobbo-reels__slider {
      position: relative;
      width: 100%;
    }

    .cobbo-reels__track {
      display: flex;
      gap: 18px;
      width: 100%;
      padding: 5px 2px 18px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .cobbo-reels__track::-webkit-scrollbar { display: none; }

    /*
      Cała karta jest wyższa niż 9:16, ponieważ Instagram dodaje
      własny nagłówek z profilem i stopkę. Dzięki temu sam film 9:16
      nie jest przycinany.
    */
    .cobbo-reel {
      position: relative;
      flex: 0 0 calc((100% - 54px) / 3.45);
      aspect-ratio: 9 / 19.4;
      overflow: hidden;
      scroll-snap-align: start;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,.09);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .cobbo-reel:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 34px rgba(0,0,0,.14);
    }

    .cobbo-reel__embed {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    /*
      Nie nakładamy już warstwy na cały Instagram.
      Dzięki temu profil u góry i przycisk profilu na dole
      pozostają normalnie klikalne.
    */
    .cobbo-reel__play {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      width: 66px;
      height: 66px;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.96);
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 180ms ease, background 180ms ease;
    }

    .cobbo-reel__play:hover {
      transform: translate(-50%, -50%) scale(1.08);
      background: #fff;
    }

    .cobbo-reel__play::after {
      content: "";
      width: 0;
      height: 0;
      margin-left: 5px;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 16px solid #111;
    }

    .cobbo-reels__arrow {
      position: absolute;
      top: 50%;
      z-index: 20;
      width: 48px;
      height: 48px;
      transform: translateY(-50%);
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #000;
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 7px 24px rgba(0,0,0,.16);
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .cobbo-reels__arrow:hover {
      transform: translateY(-50%) scale(1.06);
    }

    .cobbo-reels__arrow--prev { left: -24px; }
    .cobbo-reels__arrow--next { right: -24px; }

    .cobbo-reels__arrow:disabled {
      opacity: .24;
      pointer-events: none;
    }

    @media (max-width: 1050px) {
      .cobbo-reels {
        padding-left: 46px;
        padding-right: 46px;
      }

      .cobbo-reel {
        flex-basis: calc((100% - 36px) / 2.45);
      }
    }

    @media (max-width: 700px) {
      .cobbo-reels {
        padding: 26px 0 30px;
      }

      .cobbo-reels__header {
        margin-bottom: 20px;
        padding: 0 18px;
        text-align: left;
      }

      .cobbo-reels__title { font-size: 27px; }
      .cobbo-reels__description { font-size: 14px; }

      .cobbo-reels__track {
        gap: 13px;
        padding: 4px 18px 16px;
      }

      .cobbo-reel {
        flex: 0 0 72%;
        border-radius: 19px;
      }

      .cobbo-reel__play {
        width: 58px;
        height: 58px;
      }

      .cobbo-reels__arrow {
        width: 42px;
        height: 42px;
        font-size: 29px;
      }

      .cobbo-reels__arrow--prev { left: 5px; }
      .cobbo-reels__arrow--next { right: 5px; }
    }
  </style>
</head>

<body>
<section class="cobbo-reels" id="cobboReels">
  <div class="cobbo-reels__header">
    <h2 class="cobbo-reels__title">Zobacz COBBO w praktyce</h2>
    <p class="cobbo-reels__description">
      Zobacz, jak nasze urządzenia sprawdzają się w codziennym użytkowaniu.
      Obejrzyj materiały przygotowane przez twórców i poznaj COBBO z praktycznej strony.
    </p>
  </div>

  <div class="cobbo-reels__slider">
    <button class="cobbo-reels__arrow cobbo-reels__arrow--prev" type="button" aria-label="Poprzednie filmy">‹</button>
    <div class="cobbo-reels__track" id="cobboReelsTrack"></div>
    <button class="cobbo-reels__arrow cobbo-reels__arrow--next" type="button" aria-label="Następne filmy">›</button>
  </div>
</section>

<script>
(() => {
  /* =========================================================
     JEDYNA SEKCJA DO EDYCJI PRZY ZMIANIE ROLEK
     ========================================================= */
  const REELS = [
    "https://www.instagram.com/reel/DUIP1orgvCl/",
    "https://www.instagram.com/reels/DcxjoioNhFK/",
    "https://www.instagram.com/reels/DcdwVWgCnBc/",
    "https://www.instagram.com/reels/DafaE6ht9BB/",
    "https://www.instagram.com/reels/DUIP1orgvCl/"
  ];

  const track = document.getElementById("cobboReelsTrack");
  const prevButton = document.querySelector(".cobbo-reels__arrow--prev");
  const nextButton = document.querySelector(".cobbo-reels__arrow--next");

  function normalizeInstagramUrl(url) {
    try {
      const parsed = new URL(url);
      const match = parsed.pathname.match(/\/reels?\/([^/]+)/);
      if (!match) return null;
      return "https://www.instagram.com/reel/" + match[1] + "/";
    } catch {
      return null;
    }
  }

  const reels = Array.from(new Set(REELS.map(normalizeInstagramUrl).filter(Boolean)));

  function getReelId(url) {
    const match = String(url).match(/\/reel\/([^/]+)/);
    return match ? match[1] : null;
  }

  function getEmbedUrl(url) {
    const id = getReelId(url);
    return id ? "https://www.instagram.com/reel/" + id + "/embed/" : "";
  }

  reels.forEach((reelUrl, index) => {
    const card = document.createElement("article");
    card.className = "cobbo-reel";

    const iframe = document.createElement("iframe");
    iframe.className = "cobbo-reel__embed";
    iframe.src = getEmbedUrl(reelUrl);
    iframe.loading = index < 2 ? "eager" : "lazy";
    iframe.scrolling = "no";
    iframe.title = "Instagram Reel " + (index + 1);
    iframe.setAttribute(
      "allow",
      "autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
    );
    iframe.setAttribute("allowfullscreen", "");

    const play = document.createElement("button");
    play.className = "cobbo-reel__play";
    play.type = "button";
    play.setAttribute("aria-label", "Otwórz film w powiększeniu");

    play.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();

      window.parent.postMessage(
        {
          type: "COBBO_REELS_OPEN",
          index: index,
          reels: reels
        },
        "*"
      );
    });

    card.appendChild(iframe);
    card.appendChild(play);
    track.appendChild(card);
  });

  function getScrollDistance() {
    const card = track.querySelector(".cobbo-reel");
    if (!card) return 300;

    const styles = window.getComputedStyle(track);
    const gap = parseFloat(styles.gap || 0);
    return card.offsetWidth + gap;
  }

  prevButton.addEventListener("click", () => {
    track.scrollBy({ left: -getScrollDistance(), behavior: "smooth" });
  });

  nextButton.addEventListener("click", () => {
    track.scrollBy({ left: getScrollDistance(), behavior: "smooth" });
  });

  function updateArrows() {
    const maxScroll = track.scrollWidth - track.clientWidth;
    prevButton.disabled = track.scrollLeft <= 5;
    nextButton.disabled = track.scrollLeft >= maxScroll - 5;
  }

  track.addEventListener("scroll", updateArrows, { passive: true });

  function sendHeight() {
    window.parent.postMessage(
      {
        type: "COBBO_REELS_HEIGHT",
        height: Math.ceil(document.documentElement.scrollHeight)
      },
      "*"
    );
  }

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(sendHeight);
    observer.observe(document.body);
  }

  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", () => {
    updateArrows();
    sendHeight();
  });

  requestAnimationFrame(() => {
    updateArrows();
    sendHeight();
  });
})();
</script>
</body>
</html>
