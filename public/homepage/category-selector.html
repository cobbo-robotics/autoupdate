<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kategorie COBBO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 100%;

      background: #ffffff;
      color: #111111;

      overflow-x: hidden;

      font-family:
        "SF Pro Display",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       MODUŁ
    ========================================================= */

    .cobbo-categories {
      --page-padding: 28px;
      --gap: 30px;

      --container-width: 1500px;
      --image-height: 230px;

      --text: #111111;
      --border: #d4d4d4;

      position: relative;

      width: 100%;

      padding: 30px 0 10px;

      background: #ffffff;

      overflow: hidden;
    }

    .cobbo-categories__inner {
      position: relative;

      width: 100%;
      max-width: var(--container-width);

      margin: 0 auto;

      padding-left: var(--page-padding);
      padding-right: var(--page-padding);
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .cobbo-categories__header {
      position: relative;
      z-index: 5;
    }

    .cobbo-categories__eyebrow {
      margin: 0 0 8px;

      font-size: 13px;
      line-height: 1.2;
      font-weight: 700;

      letter-spacing: 0.045em;
      text-transform: uppercase;

      color: #111111;
    }

    .cobbo-categories__title {
      margin: 0;

      max-width: 900px;

      font-size: clamp(32px, 2.5vw, 43px);
      line-height: 1.04;
      font-weight: 700;

      letter-spacing: -0.04em;

      color: var(--text);
    }

    /* =========================================================
       TABS
    ========================================================= */

    .cobbo-categories__tabs-wrapper {
      position: relative;
      z-index: 5;

      margin-top: 18px;

      overflow: hidden;
    }

    .cobbo-categories__tabs {
      display: flex;
      align-items: center;

      gap: 10px;

      width: 100%;

      overflow-x: auto;
      overflow-y: hidden;

      scrollbar-width: none;
      -ms-overflow-style: none;

      -webkit-overflow-scrolling: touch;

      touch-action: pan-x pan-y;
    }

    .cobbo-categories__tabs::-webkit-scrollbar {
      display: none;
    }

    .cobbo-tab {
      flex: 0 0 auto;

      min-height: 42px;

      padding: 0 18px;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: #ffffff;
      color: #666666;

      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;

      cursor: pointer;

      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease;
    }

    .cobbo-tab:hover {
      color: #111111;
      border-color: #111111;
    }

    .cobbo-tab:active {
      transform: scale(0.97);
    }

    .cobbo-tab.is-active {
      color: #ffffff;

      background: #111111;
      border-color: #111111;
    }

    /* =========================================================
       STAGE
    ========================================================= */

    .cobbo-categories__stage {
      position: relative;

      margin-top: 20px;

      isolation: isolate;
    }

/* =========================================================
   PEŁNOSZEROKOŚCIOWY GRADIENT
========================================================= */

.cobbo-categories__stage::before {
  content: "";

  position: absolute;
  z-index: 0;

  top: calc(var(--image-height) * 0.32);

  left: 50%;

  width: 100vw;

  height:
    calc(
      100% -
      (var(--image-height) * 0.32)
    );

  transform: translateX(-50%);

  background:
    linear-gradient(
      180deg,
      #FBFAF8 0%,
      #FBFAF8 45%,
      #FCFBFA 65%,
      #FFFFFF 100%
    );

  pointer-events: none;
}


/* =========================================================
   MIĘKKIE PRZEJŚCIE POD PRODUKTAMI
========================================================= */


    /* =========================================================
       SLIDER
    ========================================================= */

    .cobbo-categories__viewport {
      position: relative;
      z-index: 2;

      width: 100%;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;

      scrollbar-width: none;
      -ms-overflow-style: none;

      -webkit-overflow-scrolling: touch;

      touch-action: pan-x pan-y;

      overscroll-behavior-x: contain;

      cursor: grab;
    }

    .cobbo-categories__viewport:active {
      cursor: grabbing;
    }

    .cobbo-categories__viewport::-webkit-scrollbar {
      display: none;
    }

    .cobbo-categories__track {
      display: flex;
      align-items: stretch;

      gap: var(--gap);

      min-width: 100%;
    }

    /* =========================================================
       KAFEL
    ========================================================= */

    .cobbo-card {
      flex:
        0 0
        calc(
          (100% - (var(--gap) * 3))
          / 4
        );

      min-width: 0;

      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .cobbo-card__link {
      position: relative;

      display: block;

      width: 100%;
      height: 100%;

      color: inherit;
      text-decoration: none;

      outline: none;

      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       OBRAZEK
    ========================================================= */

    .cobbo-card__image-area {
      position: relative;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      width: 100%;
      height: var(--image-height);

      padding: 6px 10px 0;

      overflow: hidden;
    }

    .cobbo-card__image {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center bottom;

      transform: scale(0.91);
      transform-origin: center bottom;

      transition:
        transform 0.28s ease,
        filter 0.28s ease;

      user-select: none;
      -webkit-user-select: none;

      -webkit-user-drag: none;

      pointer-events: none;
    }

    .cobbo-card__link:hover
    .cobbo-card__image {
      transform: scale(0.96);
    }

    /* =========================================================
       NAZWA
    ========================================================= */

    .cobbo-card__name {
      display: flex;
      align-items: flex-start;
      justify-content: center;

      gap: 7px;

      min-height: 72px;

      padding: 18px 8px 12px;

      color: #111111;

      text-align: center;

      font-size: 16px;
      line-height: 1.28;
      font-weight: 600;

      text-decoration-line: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .cobbo-card__arrow {
      flex: 0 0 auto;

      display: inline-block;

      font-size: 18px;
      line-height: 1;

      text-decoration: none;

      transition: transform 0.2s ease;
    }

    .cobbo-card__link:hover
    .cobbo-card__arrow {
      transform: translateX(4px);
    }

    /* =========================================================
       DOLNA NAWIGACJA
    ========================================================= */

    .cobbo-categories__navigation {
      position: relative;
      z-index: 3;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 62px;

      padding: 5px 0 2px;
    }

    .cobbo-categories__navigation.is-hidden {
      display: none;
    }

    .cobbo-categories__dots {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      min-height: 42px;
    }

    .cobbo-dot {
      width: 5px;
      height: 5px;

      padding: 0;

      border: 0;
      border-radius: 999px;

      background: #9a9a9a;

      cursor: pointer;

      transition:
        width 0.2s ease,
        height 0.2s ease,
        background 0.2s ease;
    }

    .cobbo-dot.is-active {
      width: 12px;
      height: 12px;

      background: #242424;
    }

    .cobbo-categories__arrows {
      position: absolute;

      top: 50%;
      right: 0;

      display: flex;
      align-items: center;

      gap: 8px;

      transform: translateY(-50%);
    }

    .cobbo-arrow {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 38px;
      height: 38px;

      padding: 0;

      border: 1px solid #161616;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.93);
      color: #111111;

      font-size: 21px;
      line-height: 1;

      cursor: pointer;

      backdrop-filter: blur(5px);

      transition:
        color 0.2s ease,
        background 0.2s ease,
        opacity 0.2s ease,
        transform 0.15s ease;
    }

    .cobbo-arrow:hover:not(:disabled) {
      color: #ffffff;

      background: #111111;
    }

    .cobbo-arrow:active:not(:disabled) {
      transform: scale(0.94);
    }

    .cobbo-arrow:disabled {
      opacity: 0.25;

      cursor: default;
    }

    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 1100px) {

      .cobbo-categories {
        --gap: 22px;
      }

      .cobbo-card {
        flex:
          0 0
          calc(
            (100% - (var(--gap) * 2))
            / 3
          );
      }

    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .cobbo-categories {
        --page-padding: 18px;
        --gap: 14px;
        --image-height: 205px;

        padding-top: 20px;
        padding-bottom: 7px;
      }

      .cobbo-categories__eyebrow {
        margin-bottom: 7px;

        font-size: 11px;
      }

      .cobbo-categories__title {
        display: flex;
        align-items: flex-start;

        max-width: 390px;

        min-height: 65px;

        font-size: 30px;
        line-height: 1.08;
      }

      .cobbo-categories__tabs-wrapper {
        margin-top: 10px;

        margin-right:
          calc(
            var(--page-padding) * -1
          );
      }

      .cobbo-categories__tabs {
        gap: 9px;

        padding-right: var(--page-padding);
      }

      .cobbo-tab {
        min-height: 39px;

        padding: 0 15px;

        font-size: 14px;
      }

      .cobbo-categories__stage {
        margin-top: 14px;

        margin-right:
          calc(
            var(--page-padding) * -1
          );
      }

      .cobbo-categories__stage::before {
        top:
          calc(
            var(--image-height) * 0.52
          );

        height:
          calc(
            100% -
            (var(--image-height) * 0.52)
          );
      }

      .cobbo-categories__stage::after {
        top:
          calc(
            var(--image-height) * 0.52
          );

        height: 60px;
      }

      .cobbo-categories__viewport {
        padding-right: var(--page-padding);

        cursor: default;
      }

      .cobbo-categories__viewport:active {
        cursor: default;
      }

      .cobbo-categories__track {
        padding-right: var(--page-padding);
      }

      .cobbo-card {
        flex: 0 0 43%;
      }

      .cobbo-card__image-area {
        padding: 4px 3px 0;
      }

      .cobbo-card__image {
        transform: scale(0.95);
      }

      .cobbo-card__link:hover
      .cobbo-card__image {
        transform: scale(0.95);
      }

      .cobbo-card__name {
        justify-content: flex-start;

        min-height: 74px;

        padding: 14px 4px 12px;

        text-align: left;

        font-size: 14px;
        line-height: 1.28;
      }

      .cobbo-categories__navigation {
        justify-content: flex-start;

        min-height: 60px;

        padding-right: var(--page-padding);
      }

      .cobbo-categories__dots {
        justify-content: flex-start;
      }

      .cobbo-categories__arrows {
        right: var(--page-padding);
      }

      .cobbo-arrow {
        width: 39px;
        height: 39px;
      }

    }

    /* =========================================================
       MAŁE TELEFONY
    ========================================================= */

    @media (max-width: 420px) {

      .cobbo-categories {
        --image-height: 188px;
      }

      .cobbo-categories__title {
        min-height: 65px;

        font-size: 29px;
      }

      .cobbo-card {
        flex: 0 0 45%;
      }

    }
  </style>
</head>

<body>

<section
  class="cobbo-categories"
  aria-label="Kategorie produktów COBBO"
>

  <div class="cobbo-categories__inner">

    <header class="cobbo-categories__header">

      <p class="cobbo-categories__eyebrow">
        KUP WEDŁUG KATEGORII
      </p>

      <h2
        class="cobbo-categories__title"
        id="categoryTitle"
      >
        Sprzątanie bez zbędnego wysiłku
      </h2>

    </header>


    <div class="cobbo-categories__tabs-wrapper">

      <div
        class="cobbo-categories__tabs"
        id="categoryTabs"
        role="tablist"
        aria-label="Kategorie produktów"
      ></div>

    </div>


    <div class="cobbo-categories__stage">

      <div
        class="cobbo-categories__viewport"
        id="categoryViewport"
      >

        <div
          class="cobbo-categories__track"
          id="categoryTrack"
        ></div>

      </div>


      <div
        class="cobbo-categories__navigation"
        id="categoryNavigation"
      >

        <div
          class="cobbo-categories__dots"
          id="categoryDots"
          aria-label="Nawigacja slidera"
        ></div>


        <div class="cobbo-categories__arrows">

          <button
            class="cobbo-arrow"
            id="categoryPrev"
            type="button"
            aria-label="Poprzednie kategorie"
          >
            ←
          </button>

          <button
            class="cobbo-arrow"
            id="categoryNext"
            type="button"
            aria-label="Następne kategorie"
          >
            →
          </button>

        </div>

      </div>

    </div>

  </div>

</section>


<script>
  /* ============================================================
     PLACEHOLDER GRAFIKI
  ============================================================ */

  const PLACEHOLDER =
    "https://cobbo.pl/upload/cobbo/q6pro-render-tyl.png";


  /* ============================================================
     DANE KATEGORII
  ============================================================ */

  const CATEGORY_DATA = [

    /* =========================================================
       SPRZĄTANIE
    ========================================================= */

    {
      id: "sprzatanie",

      label: "Sprzątanie",

      title: "Sprzątanie bez zbędnego wysiłku",

      items: [

      {
          name: "Roboty do okien",
          url: "https://cobbo.pl/Roboty-do-okien-c45",
          image: "https://cobbo.pl/upload/cobbo/rob-ok.png"
        },


        {
          name: "Roboty sprzątające",
          url: "https://cobbo.pl/Roboty-c23",
          image: "https://cobbo.pl/upload/cobbo/rob-sprz.png"
        },

        

        {
          name: "Odkurzacze pionowe i piorące",
          url: "https://cobbo.pl/Odkurzacze-pionowe-c196",
          image: "https://cobbo.pl/upload/cobbo/odk-pion.png"
        },

        {
          name: "Akcesoria do sprzątania",
          url: "https://cobbo.pl/Roboty-sprzatajace-c47",
          image: "https://cobbo.pl/upload/cobbo/akc-okienne.png"
        }

      ]
    },


    /* =========================================================
       KUCHNIA
    ========================================================= */

    {
      id: "kuchnia",

      label: "Kuchnia",

      title: "Gotuj prościej, szybciej, sprytniej",

      items: [

        {
          name: "Roboty kuchenne",
          url: "https://cobbo.pl/Roboty-kuchenne-c44",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-rob-kuch.png"
        },

        {
          name: "Frytkownice beztłuszczowe / Air Fryer",
          url: "https://cobbo.pl/Frytkownica-beztluszczowa-COBBO-SMART-FRY-360-AI-p630",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-air.png"
        },

        {
          name: "Akcesoria kuchenne",
          url: "https://cobbo.pl/Roboty-kuchenne-c44",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-akckuch.png"
        }

      ]
    },


    /* =========================================================
       DOM
    ========================================================= */

    {
      id: "dom",

      label: "Dom",

      title: "Więcej wygody w codziennych obowiązkach",

      items: [

        {
          name: "Prasowalnice parowe",
          url: "https://cobbo.pl/Prasowalnice-parowe-c280",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-pras.png"
        },

        {
          name: "Szczotki automatyczne",
          url: "https://cobbo.pl/Urzadzenia-c323",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-szcz.png"
        },

        {
          name: "Środki czystości",
          url: "https://cobbo.pl/Srodki-czystosci-c241",
          image: "https://cobbo.pl/upload/cobbo/kat/akc-srodki.png"
        },

        {
          name: "Akcesoria do domu",
          url: "https://cobbo.pl/Srodki-czystosci-c241",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-akc-dom.png"
        }

      ]
    },


    /* =========================================================
       ZWIERZĘTA
    ========================================================= */

    {
      id: "zwierzeta",

      label: "Zwierzęta",

      title: "Komfort dla Ciebie i Twojego pupila",

      items: [

        {
          name: "Kuwety automatyczne",
          url: "https://cobbo.pl/Kuwety-dla-zwierzat-c289",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-kuw.png"
        },

        {
          name: "Akcesoria do kuwet",
          url: "https://cobbo.pl/Kuwety-dla-zwierzat-c289",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-akc-kuw.png"
        }

      ]
    },


    /* =========================================================
       URODA
    ========================================================= */

    {
      id: "uroda",

      label: "Uroda",

      title: "Technologia, która dba o Ciebie",

      items: [

        {
          name: "Uroda i pielęgnacja",
          url: "https://cobbo.pl/Uroda-i-pielegnacja-c293",
          image: "https://cobbo.pl/upload/cobbo/kat/kat-beauty.png"
        },

        
      ]
    },


    /* =========================================================
       OUTLET
    ========================================================= */

    {
      id: "outlet",

      label: "Outlet",

      title: "Technologia COBBO w niższej cenie",

      items: [

        {
          name: "Outlet COBBO",
          url: "https://cobbo.pl/Outlet-c26",
          image: "https://cobbo.pl/upload/cobbo/kat/akc-outlet.png"
        }

      ]
    }

  ];


  /* ============================================================
     ELEMENTY
  ============================================================ */

  const titleElement =
    document.getElementById("categoryTitle");

  const tabsElement =
    document.getElementById("categoryTabs");

  const trackElement =
    document.getElementById("categoryTrack");

  const viewportElement =
    document.getElementById("categoryViewport");

  const navigationElement =
    document.getElementById("categoryNavigation");

  const dotsElement =
    document.getElementById("categoryDots");

  const prevButton =
    document.getElementById("categoryPrev");

  const nextButton =
    document.getElementById("categoryNext");


  let activeCategoryId =
    "sprzatanie";

  let snapPositions =
    [];

  let scrollTicking =
    false;

  let resizeTimer;


  /* ============================================================
     TABS
  ============================================================ */

  function renderTabs() {

    tabsElement.innerHTML = "";


    CATEGORY_DATA.forEach(category => {

      const button =
        document.createElement("button");


      button.type =
        "button";


      button.className =
        "cobbo-tab" +
        (
          category.id === activeCategoryId
            ? " is-active"
            : ""
        );


      button.textContent =
        category.label;


      button.setAttribute(
        "role",
        "tab"
      );


      button.setAttribute(
        "aria-selected",
        category.id === activeCategoryId
          ? "true"
          : "false"
      );


      button.addEventListener(
        "click",
        () => {

          if (
            category.id === activeCategoryId
          ) {
            return;
          }


          activeCategoryId =
            category.id;


          renderTabs();

          renderCards();


          requestAnimationFrame(() => {

            const activeButton =
              tabsElement.querySelector(
                ".cobbo-tab.is-active"
              );


            if (activeButton) {

              activeButton.scrollIntoView({
                behavior: "smooth",
                block: "nearest",
                inline: "center"
              });

            }

          });

        }
      );


      tabsElement.appendChild(
        button
      );

    });

  }


  /* ============================================================
     KAFLE
  ============================================================ */

  function renderCards() {

    const category =
      CATEGORY_DATA.find(
        item =>
          item.id === activeCategoryId
      );


    if (!category) {
      return;
    }


    titleElement.textContent =
      category.title;


    trackElement.innerHTML =
      "";


    category.items.forEach(item => {

      const article =
        document.createElement("article");


      article.className =
        "cobbo-card";


      const link =
        document.createElement("a");


      link.className =
        "cobbo-card__link";


      link.href =
        item.url;


      link.target =
        "_top";


      const imageArea =
        document.createElement("div");


      imageArea.className =
        "cobbo-card__image-area";


      const image =
        document.createElement("img");


      image.className =
        "cobbo-card__image";


      image.src =
        item.image;


      image.alt =
        item.name;


      image.loading =
        "lazy";


      image.draggable =
        false;


      imageArea.appendChild(
        image
      );


      const name =
        document.createElement("div");


      name.className =
        "cobbo-card__name";


      const nameText =
        document.createElement("span");


      nameText.textContent =
        item.name;


      const arrow =
        document.createElement("span");


      arrow.className =
        "cobbo-card__arrow";


      arrow.setAttribute(
        "aria-hidden",
        "true"
      );


      arrow.textContent =
        "→";


      name.appendChild(
        nameText
      );


      name.appendChild(
        arrow
      );


      link.appendChild(
        imageArea
      );


      link.appendChild(
        name
      );


      article.appendChild(
        link
      );


      trackElement.appendChild(
        article
      );

    });


    viewportElement.scrollTo({
      left: 0,
      behavior: "auto"
    });


    requestAnimationFrame(() => {

      requestAnimationFrame(() => {

        buildSnapPositions();

        updateNavigation();

      });

    });

  }


  /* ============================================================
     OVERFLOW
  ============================================================ */

  function hasHorizontalOverflow() {

    return (
      viewportElement.scrollWidth >
      viewportElement.clientWidth + 2
    );

  }


  /* ============================================================
     SNAP POSITIONS
  ============================================================ */

  function buildSnapPositions() {

    if (
      !hasHorizontalOverflow()
    ) {

      snapPositions =
        [0];


      renderDots();

      return;

    }


    const cards =
      Array.from(
        trackElement.querySelectorAll(
          ".cobbo-card"
        )
      );


    const maxScroll =
      Math.max(
        0,
        viewportElement.scrollWidth -
        viewportElement.clientWidth
      );


    const positions =
      [0];


    cards.forEach(card => {

      const position =
        Math.min(
          card.offsetLeft,
          maxScroll
        );


      positions.push(
        position
      );

    });


    positions.push(
      maxScroll
    );


    const uniquePositions =
      [
        ...new Set(
          positions.map(
            value =>
              Math.round(value)
          )
        )
      ];


    snapPositions =
      uniquePositions.filter(
        (value, index, array) => {

          if (
            index === 0
          ) {
            return true;
          }


          return (
            value -
            array[index - 1]
          ) > 10;

        }
      );


    if (
      snapPositions.length === 0
    ) {

      snapPositions =
        [0];

    }


    renderDots();

  }


  /* ============================================================
     DOTS
  ============================================================ */

  function renderDots() {

    dotsElement.innerHTML =
      "";


    const canScroll =
      hasHorizontalOverflow() &&
      snapPositions.length > 1;


    navigationElement.classList.toggle(
      "is-hidden",
      !canScroll
    );


    if (
      !canScroll
    ) {

      prevButton.disabled =
        true;


      nextButton.disabled =
        true;


      return;

    }


    snapPositions.forEach(
      (position, index) => {

        const dot =
          document.createElement("button");


        dot.type =
          "button";


        dot.className =
          "cobbo-dot";


        dot.setAttribute(
          "aria-label",
          `Przejdź do pozycji ${index + 1}`
        );


        dot.addEventListener(
          "click",
          () => {

            viewportElement.scrollTo({
              left: position,
              behavior: "smooth"
            });

          }
        );


        dotsElement.appendChild(
          dot
        );

      }
    );

  }


  /* ============================================================
     BIEŻĄCA POZYCJA
  ============================================================ */

  function getCurrentSnapIndex() {

    const currentScroll =
      viewportElement.scrollLeft;


    let closestIndex =
      0;


    let closestDistance =
      Infinity;


    snapPositions.forEach(
      (position, index) => {

        const distance =
          Math.abs(
            position -
            currentScroll
          );


        if (
          distance <
          closestDistance
        ) {

          closestDistance =
            distance;


          closestIndex =
            index;

        }

      }
    );


    return closestIndex;

  }


  /* ============================================================
     UPDATE NAWIGACJI
  ============================================================ */

  function updateNavigation() {

    const canScroll =
      hasHorizontalOverflow() &&
      snapPositions.length > 1;


    navigationElement.classList.toggle(
      "is-hidden",
      !canScroll
    );


    if (
      !canScroll
    ) {

      prevButton.disabled =
        true;


      nextButton.disabled =
        true;


      return;

    }


    const currentIndex =
      getCurrentSnapIndex();


    const dots =
      dotsElement.querySelectorAll(
        ".cobbo-dot"
      );


    dots.forEach(
      (dot, index) => {

        dot.classList.toggle(
          "is-active",
          index === currentIndex
        );

      }
    );


    prevButton.disabled =
      currentIndex <= 0;


    nextButton.disabled =
      currentIndex >=
      snapPositions.length - 1;

  }


  /* ============================================================
     GO TO SNAP
  ============================================================ */

  function goToSnap(index) {

    if (
      !snapPositions.length
    ) {
      return;
    }


    const safeIndex =
      Math.max(
        0,
        Math.min(
          index,
          snapPositions.length - 1
        )
      );


    viewportElement.scrollTo({
      left:
        snapPositions[safeIndex],

      behavior:
        "smooth"
    });

  }


  /* ============================================================
     STRZAŁKI
  ============================================================ */

  prevButton.addEventListener(
    "click",
    () => {

      goToSnap(
        getCurrentSnapIndex() - 1
      );

    }
  );


  nextButton.addEventListener(
    "click",
    () => {

      goToSnap(
        getCurrentSnapIndex() + 1
      );

    }
  );


  /* ============================================================
     SWIPE / SCROLL
  ============================================================ */

  viewportElement.addEventListener(
    "scroll",
    () => {

      if (
        scrollTicking
      ) {
        return;
      }


      scrollTicking =
        true;


      requestAnimationFrame(() => {

        updateNavigation();


        scrollTicking =
          false;

      });

    },
    {
      passive: true
    }
  );


  /* ============================================================
     RESIZE
  ============================================================ */

  window.addEventListener(
    "resize",
    () => {

      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          () => {

            buildSnapPositions();

            updateNavigation();

          },
          120
        );

    }
  );


  /* ============================================================
     INIT
  ============================================================ */

  renderTabs();

  renderCards();

</script>

</body>
</html>
