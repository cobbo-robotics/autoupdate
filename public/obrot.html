
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COBBO G7 - Obrót 360°</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .cobbo-video {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cobbo-video video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="cobbo-video">
    <video
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
      disableremoteplayback
    >
      <source
        src="https://cobbo.pl/upload/cobbo/opisy-produktow/g7/obrot.mp4"
        type="video/mp4"
      >
    </video>
  </div>

  <script>
    const video = document.querySelector("video");

    video.muted = true;
    video.defaultMuted = true;

    function startVideo() {
      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }
    }

    video.addEventListener("loadeddata", startVideo);
    window.addEventListener("pageshow", startVideo);
    startVideo();
  </script>

</body>
</html>
