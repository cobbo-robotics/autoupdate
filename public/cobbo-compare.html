<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porównywarka COBBO</title>
<style>
html, body { margin: 0; padding: 0; background: transparent; }

#cc-root { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #000; max-width: 1140px; margin: 0 auto; padding: 8px 16px 24px; box-sizing: border-box; line-height: 1.5; }
#cc-root * { box-sizing: border-box; }

/* ===== ZAKŁADKI KATEGORII ===== */
#cc-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 32px; }
#cc-tabs button { appearance: none; border: 1px solid #0c1618; background: #fff; color: #0c1618; padding: 12px 24px; border-radius: 30px; font: inherit; font-weight: 700; font-size: 10pt; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; transition: background 0.2s, color 0.2s; }
#cc-tabs button:hover { background: #f7f5f2; }
#cc-tabs button[aria-selected="true"] { background: #0c1618; color: #fff; box-shadow: inset 0 -3px 0 #F0D381; }

/* ===== KROK 1: WYBÓR MODELI ===== */
#cc-step { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 14px; }
#cc-step-title { margin: 0; font-size: 18pt; font-weight: 800; }
#cc-step-hint { margin: 0; font-size: 10.5pt; color: #888; transition: color 0.2s; }
#cc-step-hint[data-warn] { color: #c0392b; font-weight: 700; }

#cc-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
#cc-picker button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 10px 12px; background: #fff; border: 1px solid #e6e3dc; border-radius: 18px; cursor: pointer; font: inherit; color: #000; text-align: center; transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s; }
#cc-picker button:hover { border-color: #0c1618; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
#cc-picker button[aria-pressed="true"] { border: 2px solid #0c1618; padding: 13px 9px 11px; background: #fcfbf8; }
#cc-picker button[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
#cc-picker button[aria-disabled="true"]:hover { transform: none; box-shadow: none; border-color: #e6e3dc; }
#cc-picker img { display: block; width: 100%; height: 92px; object-fit: contain; margin-bottom: 4px; }
#cc-picker b { font-size: 11pt; font-weight: 800; line-height: 1.25; }
#cc-picker span[data-price] { font-size: 10pt; color: #444; }
#cc-picker span[data-badge] { position: absolute; top: 9px; left: 9px; background: #F0D381; color: #0c1618; font-size: 7.5pt; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; }
#cc-picker span[data-action] { margin-top: 6px; font-size: 9pt; font-weight: 700; padding: 5px 12px; border-radius: 20px; background: #f7f5f2; color: #0c1618; }
#cc-picker button[aria-pressed="true"] span[data-action] { background: #0c1618; color: #fff; }

/* ===== PASEK OPCJI ===== */
#cc-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 20px; padding: 14px 20px; background: #f7f5f2; border-radius: 16px; margin-bottom: 20px; font-size: 10.5pt; }
#cc-count { font-weight: 700; }
#cc-bar-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 22px; }
#cc-diff-label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
#cc-diff { width: 18px; height: 18px; margin: 0; accent-color: #0c1618; cursor: pointer; }
#cc-clear { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: #888; text-decoration: underline; cursor: pointer; }

/* ===== TABELA ===== */
#cc-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 20px; border: 1px solid #eee; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: #fff; }
#cc-table { width: 100%; border-collapse: collapse; table-layout: fixed; background: #fff; }
#cc-table thead th { background: #0c1618; color: #fff; padding: 22px 14px 18px; text-align: center; vertical-align: top; border-bottom: 3px solid #F0D381; position: relative; font-weight: 400; }
#cc-table thead th[data-corner] { text-align: left; vertical-align: bottom; width: 26%; font-size: 11pt; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
#cc-table thead th[data-corner] span { display: block; margin-top: 4px; font-size: 9pt; font-weight: 400; letter-spacing: 0; text-transform: none; color: #aaa; }
#cc-table thead span[data-photo] { display: block; background: #fff; border-radius: 14px; padding: 8px; margin: 0 auto 12px; max-width: 170px; }
#cc-table thead img { display: block; width: 100%; height: 104px; object-fit: contain; }
#cc-table thead strong { display: block; font-size: 13pt; font-weight: 800; line-height: 1.25; }
#cc-table thead span[data-price] { display: block; margin-top: 2px; color: #F0D381; font-weight: 700; }
#cc-table thead a { display: inline-block; margin-top: 12px; background: #F0D381; color: #0c1618; text-decoration: none; font-weight: 800; font-size: 9pt; padding: 8px 16px; border-radius: 30px; }
#cc-table thead a:hover { background: #fff; }
#cc-table thead button[data-remove] { position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.12); color: #fff; font-size: 16px; line-height: 26px; padding: 0; cursor: pointer; }
#cc-table thead button[data-remove]:hover { background: rgba(255,255,255,0.25); }

#cc-table tr[data-group] th { background: #f7f5f2; padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; }
#cc-table tr[data-group] th[data-mname] { text-align: center; font-size: 8.5pt; font-weight: 600; color: #999; }
#cc-table tr[data-group] button { appearance: none; background: none; border: 0; padding: 0; font: inherit; font-size: 10pt; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #0c1618; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-align: left; }
#cc-table tr[data-group] button svg { transition: transform 0.2s; }
#cc-table tr[data-group] button[aria-expanded="false"] svg { transform: rotate(-90deg); }
#cc-table tr[data-group] span[data-gcount] { font-size: 8.5pt; font-weight: 600; letter-spacing: 0; color: #999; background: #fff; border-radius: 10px; padding: 0 7px; }
#cc-table tbody[data-collapsed] tr:not([data-group]) { display: none; }

#cc-table tr[data-row] th { padding: 13px 14px; border-bottom: 1px solid #eee; text-align: left; font-size: 10.5pt; font-weight: 700; color: #000; }
#cc-table tr[data-row] td { padding: 13px 14px; border-bottom: 1px solid #eee; text-align: center; vertical-align: middle; font-size: 10.5pt; color: #333; }
#cc-table tr[data-row]:hover td, #cc-table tr[data-row]:hover th { background: #fcfbf8; }
#cc-table tr[data-row] td[data-best] { background: #fbf3d9; color: #000; font-weight: 800; }
#cc-table tr[data-row]:hover td[data-best] { background: #f8ecc6; }
#cc-table span[data-v] { display: inline-flex; align-items: center; gap: 8px; text-align: left; }
#cc-table span[data-v] svg { flex: 0 0 auto; }
#cc-table span[data-empty] { color: #bbb; }
#cc-table span[data-sr], #cc-root span[data-sr] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#cc-table button[data-hint] { appearance: none; width: 18px; height: 18px; margin-left: 6px; border-radius: 50%; border: 1px solid #ccc; background: #fff; color: #888; font: inherit; font-size: 9pt; font-weight: 700; line-height: 16px; padding: 0; cursor: pointer; vertical-align: 1px; }
#cc-table span[data-hint-text][hidden] { display: none; }
#cc-table span[data-hint-text] { display: block; margin-top: 4px; font-size: 9pt; font-weight: 400; color: #666; }

#cc-empty, #cc-loading { text-align: center; padding: 50px 20px; color: #888; background: #fcfbf8; border: 1px dashed #e6e3dc; border-radius: 20px; font-size: 11pt; }
#cc-single { margin: 0 0 12px; padding: 12px 18px; border-left: 4px solid #F0D381; background: #fcfbf8; border-radius: 0 12px 12px 0; font-size: 10.5pt; }
#cc-note { margin: 14px 4px 0; font-size: 9pt; color: #888; }

/* ===== MOBILE ===== */
@media (max-width: 640px) {
  #cc-root { padding: 6px 12px 20px; }
  #cc-tabs { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; margin-bottom: 22px; padding-bottom: 4px; }
  #cc-tabs button { flex: 0 0 auto; padding: 10px 16px; font-size: 9pt; }
  #cc-step-title { font-size: 15pt; }
  #cc-picker { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  #cc-picker button { flex: 0 0 132px; scroll-snap-align: start; }
  #cc-picker img { height: 72px; }
  #cc-bar { padding: 12px 14px; }
  #cc-table thead th { padding: 16px 8px 14px; }
  #cc-table thead span[data-photo] { padding: 6px; border-radius: 10px; margin-bottom: 8px; }
  #cc-table thead img { height: 70px; }
  #cc-table thead strong { font-size: 11pt; }
  #cc-table thead a { font-size: 8.5pt; padding: 7px 12px; }
  #cc-table tr[data-mlabel] th { padding: 12px 12px 2px; text-align: left; font-size: 9.5pt; font-weight: 700; color: #000; background: #fff; }
  #cc-table tr[data-row] td { padding: 4px 10px 12px; font-size: 10pt; border-left: 1px solid #f3f3f3; }
  #cc-table tr[data-row] td:first-child { border-left: 0; }
}
</style>
</head>

  var ICON_YES = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#0c1618"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#F0D381" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var cache = {};

  function $(id) { return document.getElementById(id); }
  function norm(s) { return (s === null || s === undefined) ? '' : String(s).trim(); }
  function low(s) { return norm(s).toLowerCase(); }
  function esc(s) { return norm(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escA(s) { return esc(s).replace(/"/g, '&quot;'); }
  function maxSel() { return mq.matches ? CONFIG.maxMobile : CONFIG.maxDesktop; }
  function catById(id) { for (var i = 0; i < CONFIG.categories.length; i++) { if (CONFIG.categories[i].id === id) return CONFIG.categories[i]; } return null; }

  /* ---------- CSV ---------- */
  function parseCSV(text) {
    var rows = [], row = [], f = '', q = false, i, c;
    text = String(text).replace(/^\uFEFF/, '');
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else { q = false; } }
        else { f += c; }
      } else if (c === '"') { q = true; }
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') { f += c; }
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  }

  var FIXED_COLS = { grupa: 1, parametr: 1, lepsze: 1, podpowiedz: 1, 'podpowiedź': 1 };

  function buildCategory(rows) {
    if (!rows.length) return null;
    var head = rows[0].map(norm);
    var idx = { grupa: -1, parametr: -1, lepsze: -1, podpowiedz: -1 };
    var models = [];
    head.forEach(function (h, i) {
      var k = low(h).replace('podpowiedź', 'podpowiedz');
      if (Object.prototype.hasOwnProperty.call(idx, k)) { idx[k] = i; }
      else if (h && !FIXED_COLS[low(h)]) {
        models.push({ key: h, col: i, name: h, img: '', link: '', price: '', badge: '', def: false, hidden: false });
      }
    });
    if (idx.parametr < 0) return null;

    var params = [];
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var g = idx.grupa > -1 ? norm(row[idx.grupa]) : '';
      var p = norm(row[idx.parametr]);
      if (!p) continue;
      if (g === '#') {
        var k = low(p).replace('ę', 'e').replace('ś', 's');
        models.forEach(function (m) {
          var v = norm(row[m.col]);
          if (k === 'nazwa') { if (v) m.name = v; }
          else if (k === 'zdjecie') { m.img = v; }
          else if (k === 'link') { m.link = v; }
          else if (k === 'cena') { m.price = v; }
          else if (k === 'etykieta') { m.badge = v; }
          else if (k === 'domyslny') { m.def = low(v) === 'tak'; }
          else if (k === 'ukryj') { m.hidden = low(v) === 'tak'; }
        });
        continue;
      }
      var vals = {};
      models.forEach(function (m) { vals[m.key] = norm(row[m.col]); });
      params.push({
        group: g || 'Inne',
        name: p,
        better: idx.lepsze > -1 ? low(row[idx.lepsze]).replace('ę', 'e') : '',
        hint: idx.podpowiedz > -1 ? norm(row[idx.podpowiedz]) : '',
        values: vals
      });
    }
    models = models.filter(function (m) { return !m.hidden; });
    return models.length ? { models: models, params: params } : null;
  }

  function loadCategory(cat) {
    if (cache[cat.id]) return Promise.resolve(cache[cat.id]);
    function fromFallback() { return FALLBACK[cat.id] ? buildCategory(parseCSV(FALLBACK[cat.id])) : null; }
    var p;
    if (cat.csv) {
      p = fetch(cat.csv, { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (t) {
          if (/^\s*</.test(t)) throw new Error('Arkusz nie jest opublikowany jako CSV');
          var d = buildCategory(parseCSV(t));
          if (!d) throw new Error('Pusty arkusz');
          return d;
        })
        .catch(function (e) { console.warn('[COBBO] Arkusz niedostępny, używam kopii zapasowej:', e); return fromFallback(); });
    } else {
      p = Promise.resolve(fromFallback());
    }
    return p.then(function (d) { if (d) cache[cat.id] = d; return d; });
  }

  /* ---------- PORÓWNYWANIE WARTOŚCI ---------- */
  function num(v) {
    var s = norm(v).replace(/(\d)[\s\u00a0](?=\d{3}(\D|$))/g, '$1').replace(',', '.');
    var m = s.match(/\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : null;
  }
  function yesNo(v) {
    var l = low(v);
    if (/^tak(\b|$)/.test(l)) return 1;
    if (/^nie(\b|$)/.test(l)) return 0;
    return null;
  }
  function bestKeys(param, keys) {
    if (keys.length < 2) return [];
    var vals = keys.map(function (k) { return param.values[k] || ''; });
    var yn = vals.map(yesNo);
    var defined = yn.filter(function (x) { return x !== null; });
    if (defined.length >= 2 && defined.indexOf(1) > -1 && defined.indexOf(0) > -1) {
      return keys.filter(function (k, i) { return yn[i] === 1; });
    }
    if (param.better !== 'wiecej' && param.better !== 'mniej') return [];
    var ns = vals.map(function (v) { return v ? num(v) : null; });
    var valid = ns.filter(function (n) { return n !== null; });
    if (valid.length < 2) return [];
    var target = param.better === 'mniej' ? Math.min.apply(null, valid) : Math.max.apply(null, valid);
    if (valid.every(function (n) { return n === target; })) return [];
    return keys.filter(function (k, i) { return ns[i] === target; });
  }

  /* ---------- RENDER ---------- */
  function fmtPrice(p) {
    var v = norm(p);
    if (/^\d+([.,]\d+)?$/.test(v)) {
      var n = Math.round(parseFloat(v.replace(',', '.')));
      return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + '\u00a0zł';
    }
    return v;
  }
  function imgTag(m, extra) {
    return '<img src="' + escA(m.img || CONFIG.fallbackImage) + '" alt="' + escA(m.name) + '"' + (extra || '') +
      ' onerror="this.onerror=null;this.src=\'' + CONFIG.fallbackImage + '\'">';
  }
  function renderValue(v) {
    if (!v) return '<span data-empty>—</span>';
    var yn = yesNo(v);
    if (yn === null) return esc(v);
    var rest = norm(v).replace(/^(tak|nie)\s*[–—\-:,]?\s*/i, '');
    return '<span data-v>' + (yn ? ICON_YES : ICON_NO) +
      (rest ? '<span>' + esc(rest) + '</span>' : '<span data-sr>' + (yn ? 'Tak' : 'Nie') + '</span>') + '</span>';
  }

  function renderTabs() {

      var on = c.id === state.cat;

  function renderPicker(d) {
    var max = maxSel();

  function renderTable(d) {

    var models = state.sel.map(function (k) {
      for (var i = 0; i < d.models.length; i++) { if (d.models[i].key === k) return d.models[i]; }

    }).filter(Boolean);
    var keys = models.map(function (m) { return m.key; });
    var n = models.length;

    var mobile = mq.matches;

      gmap[p.group].rows.push(p);
    });

    var bodies = '', shown = 0;
    groups.forEach(function (g) {
      var rowsHtml = '', cnt = 0;
      g.rows.forEach(function (p) {
        var vals = keys.map(function (k) { return p.values[k] || ''; });
        if (vals.every(function (v) { return !v; })) return;
        if (state.diff && n > 1) {
          var l = vals.map(low);
          if (l.every(function (v) { return v === l[0]; })) return;
        }
        cnt++;
        var best = bestKeys(p, keys);
        var cells = keys.map(function (k, i) {
          return '<td' + (best.indexOf(k) > -1 ? ' data-best' : '') + '>' + renderValue(vals[i]) + '</td>';
        }).join('');
        var label = esc(p.name) + (p.hint ? '<button type="button" data-hint aria-label="Co to znaczy?" aria-expanded="false">i</button><span data-hint-text hidden>' + esc(p.hint) + '</span>' : '');
        if (mobile) {

        } else {

        }
      });
      if (!cnt) return;
      shown += cnt;
      var col = !!state.collapsed[g.name];
      var head = '<tr data-group><th colspan="' + (mobile ? n : 1) + '"><button type="button" data-toggle="' + escA(g.name) + '" aria-expanded="' + !col + '">' +

          '<span data-photo>' + imgTag(m) + '</span>' +

  function selectCat(id, preset) {

    loadCategory(catById(id)).then(function (d) {
      if (state.cat !== id) return;
      if (!d) {
        $('cc-content').innerHTML = '<div id="cc-empty">Brak danych dla tej kategorii.</div>';
        reportHeight();
        return;
      }
      var lowKeys = d.models.map(function (m) { return low(m.key); });
      var sel = (preset || []).map(function (k) { var i = lowKeys.indexOf(low(k)); return i > -1 ? d.models[i].key : null; }).filter(Boolean);
      if (!sel.length) sel = d.models.filter(function (m) { return m.def; }).map(function (m) { return m.key; });
      if (!sel.length) sel = d.models.slice(0, 2).map(function (m) { return m.key; });
      state.sel = sel.filter(function (k, i) { return sel.indexOf(k) === i; }).slice(0, maxSel());
      render();
      syncUrl();
    });
  }

  function toggleModel(key) {

      return;
    } else { state.sel.push(key); }
    render();
    syncUrl();
  }

  /* ---------- ZDARZENIA ---------- */
  $('cc-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-cat]');
    if (b && b.getAttribute('data-cat') !== state.cat) selectCat(b.getAttribute('data-cat'));
  });
  $('cc-picker').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-key]');
    if (b) toggleModel(b.getAttribute('data-key'));
  });
  $('cc-content').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-remove')) { toggleModel(b.getAttribute('data-remove')); return; }
    if (b.hasAttribute('data-toggle')) {
      var g = b.getAttribute('data-toggle');
      state.collapsed[g] = !state.collapsed[g];
      var tb = b.closest('tbody');
      if (state.collapsed[g]) tb.setAttribute('data-collapsed', ''); else tb.removeAttribute('data-collapsed');
      b.setAttribute('aria-expanded', String(!state.collapsed[g]));
      reportHeight();
      return;
    }
    if (b.hasAttribute('data-hint')) {
      var t = b.nextElementSibling;
      var open = t.hasAttribute('hidden');
      if (open) t.removeAttribute('hidden'); else t.setAttribute('hidden', '');
      b.setAttribute('aria-expanded', String(open));
      reportHeight();
    }
  });
  $('cc-diff').addEventListener('change', function () { state.diff = this.checked; render(); });
  $('cc-clear').addEventListener('click', function () { state.sel = []; render(); syncUrl(); });

  function onViewportChange() {
    if (!state.cat || !cache[state.cat]) return;
    render();
  }
  if (mq.addEventListener) mq.addEventListener('change', onViewportChange); else if (mq.addListener) mq.addListener(onViewportChange);

  /* ---------- AUTOMATYCZNA WYSOKOŚĆ IFRAME ---------- */
  function reportHeight() {
    var h = Math.ceil($('cc-root').getBoundingClientRect().height) + 4;
    post({ type: 'cobbo-compare-height', height: h });
  }
  if (window.ResizeObserver) new ResizeObserver(reportHeight).observe($('cc-root'));
  window.addEventListener('load', reportHeight);

  /* ---------- START ---------- */
  var params = new URLSearchParams(location.search);
  var startCat = params.get('kat') || HASH_MAP[location.hash.replace('#', '')] || CONFIG.categories[0].id;
  var startSel = (params.get('m') || '').split(',').filter(Boolean);
  selectCat(startCat, startSel);
})();
</script>
</body>
</html>
