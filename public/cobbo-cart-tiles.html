}

.cobbo-cart-tile-bar {

  line-height: 1 !important;

/* TELEFON – 2 x 2, mniejsze kafelki */

  .cobbo-cart-tile-green .cobbo-cart-tile-bg  { font-size: 86px !important; bottom: -22px !important; }
  .cobbo-cart-tile-blue .cobbo-cart-tile-bg   { font-size: 104px !important; bottom: -32px !important; }

<script>
(function(){
  var wrap = document.getElementById('cobbo-cart-tiles-wrap');
  var last = 0;

  // Mierzymy sam kontener kafelków, NIE scrollHeight dokumentu.
  // scrollHeight nigdy nie jest mniejszy od wysokości iframe'a,
  // więc stary kod nie potrafił iframe'a zmniejszyć.
  function sendHeight(){
    if (!wrap || !window.parent || window.parent === window) return;
    var h = Math.ceil(wrap.getBoundingClientRect().height);
    if (h === last) return;
    last = h;
    window.parent.postMessage({ cobboWidget: 'cartTiles', height: h }, '*');
  }

  window.addEventListener('load', sendHeight);
  window.addEventListener('resize', sendHeight);

  if ('ResizeObserver' in window) {
    new ResizeObserver(sendHeight).observe(wrap);
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(sendHeight);
  }

  sendHeight();
  setTimeout(sendHeight, 100);
  setTimeout(sendHeight, 500);
  setTimeout(sendHeight, 1200);
})();
</script>
