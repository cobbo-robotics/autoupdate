<div id="q6pro-feature-gallery">

<style>

#q6pro-feature-gallery{
width:100%;
overflow:hidden;
font-family:SF Pro Display,-apple-system,sans-serif;
background:#fff;
color:#111;
}

#q6pro-feature-gallery *{
box-sizing:border-box;
}


#q6pro-gallery-title{
font-size:clamp(34px,5vw,56px);
line-height:1.05;
letter-spacing:-0.045em;
font-weight:700;
max-width:900px;
margin:0 auto;
padding:50px 24px 30px;
}


#q6pro-gallery-stage{
position:relative;
width:100%;
max-width:1200px;
height:620px;
margin:auto;
overflow:hidden;
}


#q6pro-gallery-image{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
transition:.5s ease;
}


#q6pro-gallery-image img{
width:85%;
height:85%;
object-fit:contain;
}


#q6pro-gallery-placeholder{
width:85%;
height:85%;
border-radius:28px;
background:
radial-gradient(circle,#fff,#ece8e2);
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
font-weight:600;
letter-spacing:.12em;
color:#aaa;
}



#q6pro-gallery-buttons{
display:flex;
gap:12px;
padding:20px 24px;
overflow-x:auto;
scrollbar-width:none;
scroll-snap-type:x mandatory;
}


#q6pro-gallery-buttons::-webkit-scrollbar{
display:none;
}


.q6pro-feature-button{

flex:0 0 auto;

height:58px;

padding:0 22px;

border:0;

border-radius:30px;

background:#f5f5f7;

display:flex;

align-items:center;

gap:10px;

font-size:16px;

color:#111;

cursor:pointer;

scroll-snap-align:center;

transition:.3s ease;

}


.q6pro-feature-button span{

width:24px;
height:24px;

border-radius:50%;

border:1px solid #777;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

}


.q6pro-feature-button.active{

background:#111;

color:#fff;

}


.q6pro-feature-button.active span{

border-color:#fff;

}



#q6pro-gallery-description{

max-width:900px;
margin:10px auto 0;
padding:0 24px 50px;

}


#q6pro-gallery-description h3{

font-size:32px;
line-height:1.1;
letter-spacing:-.035em;
margin:0 0 12px;
}


#q6pro-gallery-description p{

font-size:17px;
line-height:1.55;
color:#6e6e73;
max-width:650px;

}



#q6pro-gallery-arrow-left,
#q6pro-gallery-arrow-right{

position:absolute;

top:50%;

transform:translateY(-50%);

width:46px;
height:46px;

border-radius:50%;

border:0;

background:#e8e8ed;

font-size:28px;

cursor:pointer;

z-index:5;

}


#q6pro-gallery-arrow-left{
left:20px;
}


#q6pro-gallery-arrow-right{
right:20px;
}



@media(max-width:700px){

#q6pro-gallery-stage{

height:320px;

}


#q6pro-gallery-image img,
#q6pro-gallery-placeholder{

width:100%;
height:100%;

}


#q6pro-gallery-title{

padding-top:35px;

}


#q6pro-gallery-arrow-left,
#q6pro-gallery-arrow-right{

width:38px;
height:38px;
font-size:22px;

}


}


</style>



<h2 id="q6pro-gallery-title">
Poznaj COBBO Q6 PRO<br>
z każdej strony.
</h2>



<div id="q6pro-gallery-stage">


<button id="q6pro-gallery-arrow-left">
‹
</button>


<div id="q6pro-gallery-image">

<div id="q6pro-gallery-placeholder">
MIEJSCE NA RENDER / ANIMACJĘ
</div>

</div>


<button id="q6pro-gallery-arrow-right">
›
</button>


</div>





<div id="q6pro-gallery-buttons">


<button class="q6pro-feature-button active">
<span>+</span>
Active Dynamic Glide™
</button>


<button class="q6pro-feature-button">
<span>+</span>
3-strefowa ściereczka
</button>


<button class="q6pro-feature-button">
<span>+</span>
Spray Pulse 8™
</button>


<button class="q6pro-feature-button">
<span>+</span>
FullEdge Clean™
</button>


<button class="q6pro-feature-button">
<span>+</span>
Smart Control
</button>


</div>





<div id="q6pro-gallery-description">


<h3>
Nie tylko jedzie.<br>
Aktywnie pracuje.
</h3>


<p>
Kierunkowy system drgań działa po stronie,
która prowadzi robota podczas jazdy.
Pomaga ograniczać smugi i efekt „skóry węża”.
</p>


</div>





<script>

(function(){


const buttons =
document.querySelectorAll(
"#q6pro-gallery-buttons .q6pro-feature-button"
);


const title =
document.querySelector(
"#q6pro-gallery-description h3"
);


const text =
document.querySelector(
"#q6pro-gallery-description p"
);


const image =
document.querySelector(
"#q6pro-gallery-image"
);


const features=[

{
title:"Nie tylko jedzie.<br>Aktywnie pracuje.",
text:"Kierunkowy system drgań działa po stronie, która prowadzi robota podczas jazdy. Pomaga ograniczać smugi i efekt „skóry węża”."
},

{
title:"Jedna ściereczka.<br>Trzy etapy pracy.",
text:"Specjalna struktura materiału łączy zbieranie zabrudzeń, mycie oraz końcowe polerowanie szyby."
},

{
title:"8 kierunków natrysku.<br>Płyn dokładnie tam, gdzie trzeba.",
text:"Spray Pulse 8™ wykorzystuje osiem kierunków natrysku, aby równomiernie przygotować szybę."
},

{
title:"Cała szyba.<br>Bez kompromisów.",
text:"FullEdge Clean™ pomaga dokładniej pracować przy krawędziach, rogach i uszczelkach."
},

{
title:"Stabilność.<br>Kontrola.<br>Precyzja.",
text:"AI Cleaning Path 4.0, Anti-Wind 3.0 oraz kontrola docisku wspierają stabilną pracę robota."
}

];


let current=0;



function change(index){

current=index;


buttons.forEach((b,i)=>{

b.classList.toggle(
"active",
i===index
);

});



title.innerHTML=
features[index].title;


text.innerHTML=
features[index].text;



image.style.opacity=0;


setTimeout(()=>{

image.innerHTML=
'<div id="q6pro-gallery-placeholder">RENDER FUNKCJI '+(index+1)+'</div>';

image.style.opacity=1;

},200);


}



buttons.forEach((button,index)=>{

button.onclick=()=>{

change(index);

};

});



document
.getElementById(
"q6pro-gallery-arrow-right"
)
.onclick=()=>{

change(
(current+1)%features.length
);

};


document
.getElementById(
"q6pro-gallery-arrow-left"
)
.onclick=()=>{

change(
(current-1+features.length)%features.length
);

};




const slider =
document.getElementById(
"q6pro-gallery-buttons"
);


let start=0;


slider.addEventListener(
"touchstart",
e=>{

start=e.touches[0].clientX;

});


slider.addEventListener(
"touchend",
e=>{

let diff=
e.changedTouches[0].clientX-start;


if(Math.abs(diff)>60){

if(diff<0){

change(
(current+1)%features.length
);

}else{

change(
(current-1+features.length)%features.length
);

}

}

});


})();

</script>


</div>
