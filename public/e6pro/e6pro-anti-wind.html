<!doctype html>
<html lang="pl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

html,
body {
 width:100%;
 height:100%;
 margin:0;
 padding:0;
 overflow:hidden;
 background:#f5f5f7;
}

#e6pro-aw-video-wrap {
 position:relative;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#f5f5f7;
}

#e6pro-aw-video {
 position:absolute;
 inset:0;

 width:100%;
 height:100%;

 display:block;

 object-fit:cover;
 object-position:center;

 background:#f5f5f7;
}

</style>
</head>

<body>

<div id="e6pro-aw-video-wrap">

 <video
  id="e6pro-aw-video"
  autoplay
  muted
  loop
  playsinline
  webkit-playsinline
  preload="auto">

  <source
   src="https://cobbo.pl/upload/cobbo/anti-wind.mp4"
   type="video/mp4">

 </video>

</div>

<script>

(function() {

 var video = document.getElementById("e6pro-aw-video");

 video.muted = true;
 video.defaultMuted = true;

 function playVideo() {

  var promise = video.play();

  if (promise !== undefined) {
   promise.catch(function() {});
  }

 }

 if (video.readyState >= 2) {
  playVideo();
 } else {
  video.addEventListener("canplay", playVideo, { once:true });
 }

 document.addEventListener("visibilitychange", function() {

  if (!document.hidden) {
   playVideo();
  }

 });

})();

</script>

</body>
</html>
